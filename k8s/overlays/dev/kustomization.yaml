apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: retail-data-platform
resources:
  - ../../base
images:
  - name: retailacr.azurecr.io/retail-ingestion-api
    newName: REPLACE_WITH_DEV_ACR.azurecr.io/retail-ingestion-api
    newTag: dev
patches:
  - target:
      kind: ConfigMap
      name: retail-platform-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: dev
