name: ci

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Python validation
        run: |
          python -m compileall src tests
          ruff check .
          python -m pytest

      - name: dbt static parse
        working-directory: dbt
        env:
          SNOWFLAKE_ACCOUNT: placeholder
          SNOWFLAKE_USER: placeholder
          SNOWFLAKE_PASSWORD: placeholder
          SNOWFLAKE_ROLE: RETAIL_DBT_ROLE
          SNOWFLAKE_WAREHOUSE: RETAIL_TRANSFORM_WH
          SNOWFLAKE_DATABASE: RETAIL_DW
          SNOWFLAKE_SCHEMA: GOLD
        run: |
          python -m pip install -r ../requirements-dbt.txt
          dbt --no-version-check --log-path "$RUNNER_TEMP/retail-dbt-logs" parse --profiles-dir . --target-path "$RUNNER_TEMP/retail-dbt-target" --no-partial-parse

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"

      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate dev
        run: |
          terraform -chdir=infra/terraform/environments/dev init -backend=false
          terraform -chdir=infra/terraform/environments/dev validate

      - name: Terraform validate stage
        run: |
          terraform -chdir=infra/terraform/environments/stage init -backend=false
          terraform -chdir=infra/terraform/environments/stage validate

      - name: Terraform validate prod
        run: |
          terraform -chdir=infra/terraform/environments/prod init -backend=false
          terraform -chdir=infra/terraform/environments/prod validate

      - name: Kubernetes render
        run: |
          mkdir -p rendered
          kubectl kustomize k8s/overlays/dev > rendered/dev.yaml
          kubectl kustomize k8s/overlays/stage > rendered/stage.yaml
          kubectl kustomize k8s/overlays/prod > rendered/prod.yaml

      - name: Docker build
        run: |
          docker build -f services/ingestion-api/Dockerfile -t retail-ingestion-api:ci .
          docker build -f services/stream-processor/Dockerfile -t retail-stream-processor:ci .
