[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-global-retail-data-platform"
version = "0.1.0"
description = "Cloud-native Azure retail data platform contracts, transforms, and deployment assets."
requires-python = ">=3.11"
dependencies = [
  "azure-eventhub>=5.15.0,<6.0.0",
  "azure-identity>=1.17.0,<2.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff>=0.12.0,<1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"databricks/notebooks/*.py" = ["F821", "E501"]
